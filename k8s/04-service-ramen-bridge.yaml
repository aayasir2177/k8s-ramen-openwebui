apiVersion: v1
kind: Service
metadata:
  name: ramen-service
  namespace: ai
  labels:
    app: ramenai
spec:
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ramen-service
  namespace: ai
  labels:
    app: ramenai
subsets:
  - addresses:
      - ip: 192.168.100.11
    ports:
      - name: http
        port: 8090
        protocol: TCP
